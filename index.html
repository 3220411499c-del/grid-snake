<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>走格子贪吃蛇</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171b2e;
    --line: #262c47;
    --text: #d7dcf0;
    --dim: #8a92b2;
    --green: #34c26b;
    --green-hi: #7ef29d;
    --red: #ff5d5d;
    --amber: #ffd166;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  #wrap { width: min(600px, 96vw); }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 6px;
  }
  h1 { font-size: 20px; letter-spacing: 2px; color: var(--green-hi); }
  #hud { display: flex; gap: 14px; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
  #hud b { color: var(--text); font-size: 14px; }
  #stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
  }
  canvas { display: block; width: 100%; height: auto; border-radius: 6px; touch-action: none; }
  #overlay {
    position: absolute;
    inset: 10px;
    border-radius: 6px;
    background: rgba(10, 12, 24, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 16px;
    overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  #ov-title { font-size: 30px; font-weight: 700; letter-spacing: 4px; }
  #ov-sub { font-size: 14px; color: var(--dim); line-height: 1.9; white-space: pre-line; }
  #ov-title.win { color: var(--green-hi); }
  #ov-title.dead { color: var(--red); }
  #ov-title.pause { color: var(--amber); }
  #ov-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    background: var(--green);
    color: #06240f;
    border: none;
    border-radius: 8px;
    padding: 10px 26px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--green-hi); }
  button.ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--line);
  }
  button.ghost:hover { color: var(--text); border-color: var(--dim); }
  footer {
    margin-top: 10px;
    text-align: center;
    font-size: 12px;
    color: var(--dim);
  }
  footer kbd {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    color: var(--text);
  }
  /* 触屏方向键(仅触屏设备显示) */
  #touch-controls {
    display: none;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 52px);
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
    touch-action: none;
  }
  @media (pointer: coarse) {
    #touch-controls { display: grid; }
    .touch-only { display: inline; }
    .kb-only { display: none; }
  }
  .touch-only { display: none; }
  .pad {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 12px;
    font-size: 26px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
    padding: 0;
  }
  .pad:active { background: var(--green); color: #06240f; }
  .pad.up    { grid-area: 1 / 2; }
  .pad.left  { grid-area: 2 / 1; }
  .pad.center{ grid-area: 2 / 2; font-size: 20px; }
  .pad.right { grid-area: 2 / 3; }
  .pad.down  { grid-area: 3 / 2; }
  /* ---------- 主菜单 ---------- */
  #menu { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 500px; }
  #menu .menu-title { font-size: 26px; font-weight: 700; letter-spacing: 6px; color: var(--green-hi); }
  #menu .menu-sub { font-size: 12px; color: var(--dim); }
  .tabs { display: flex; gap: 8px; }
  .tabs button {
    flex: 1;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 8px 0;
    border-radius: 8px;
    font-size: 14px;
  }
  .tabs button.active { background: var(--green); color: #06240f; border-color: var(--green); }
  .menu-body { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .tier-legend { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 11px; color: var(--dim); }
  .tier-legend .chip { display: inline-flex; align-items: center; gap: 4px; }
  .tier-legend .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .dot.t1 { background: var(--green-hi); }
  .dot.t2 { background: #6fb7ff; }
  .dot.t3 { background: var(--amber); }
  .dot.t4 { background: #ff8f6b; }
  .lv-grid100 {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    width: 100%;
    max-height: 300px;
    overflow-y: auto;
    padding: 2px;
  }
  .lv-tile {
    aspect-ratio: 1;
    font-size: 11px;
    font-weight: 700;
    border-radius: 6px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--dim);
  }
  .lv-tile:disabled { opacity: 0.35; cursor: not-allowed; }
  .lv-tile:hover:not(:disabled) { border-color: var(--green); }
  .lv-tile.t1:not(:disabled) { color: var(--green-hi); }
  .lv-tile.t2:not(:disabled) { color: #6fb7ff; }
  .lv-tile.t3:not(:disabled) { color: var(--amber); }
  .lv-tile.t4:not(:disabled) { color: #ff8f6b; }
  .lv-tile.cleared { background: rgba(52, 194, 107, 0.18); border-color: var(--green); }
  .menu-note { font-size: 12px; color: var(--dim); line-height: 1.8; }
  .board-list {
    list-style: none;
    text-align: left;
    font-size: 13px;
    line-height: 2.1;
    width: 100%;
    max-height: 240px;
    overflow-y: auto;
  }
  .board-list li .rank { display: inline-block; width: 28px; color: var(--dim); }
  .board-list li:first-child .rank { color: var(--amber); }
  .board-list li .score { font-weight: 700; color: var(--text); }
  .board-list li .meta { color: var(--dim); font-size: 11px; margin-left: 6px; }
  .board-list .empty { color: var(--dim); text-align: center; }
  .board-name {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    width: 150px;
    text-align: center;
    font-family: inherit;
    font-size: 13px;
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>走格子贪吃蛇</h1>
    <div id="hud">
      <span>得分 <b id="hud-score">0</b></span>
      <span id="hud-mode">第 1 关</span>
      <span><span id="hud-prog-label">进度</span> <b id="hud-progress">0/8</b></span>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <div id="menu"></div>
      <div id="ov-title"></div>
      <div id="ov-sub"></div>
      <div id="ov-btns"></div>
    </div>
  </div>
  <div id="touch-controls" aria-label="触屏方向键">
    <button class="pad up" data-dir="up" aria-label="向上">↑</button>
    <button class="pad left" data-dir="left" aria-label="向左">←</button>
    <button class="pad center" id="pad-pause" aria-label="暂停或继续">⏸</button>
    <button class="pad right" data-dir="right" aria-label="向右">→</button>
    <button class="pad down" data-dir="down" aria-label="向下">↓</button>
  </div>
  <footer>
    <span class="kb-only"><kbd>↑↓←→</kbd> / <kbd>WASD</kbd> 转向 · 长按 1.5× 加速 ·
    <kbd>空格</kbd> 开始/暂停 · <kbd>R</kbd> 重开 · <kbd>Esc</kbd> 菜单 · </span><span class="touch-only">滑动或点按钮转向 · 按住按钮 1.5× 加速 · </span>边缘穿越回卷,撞到自己或障碍结束
  </footer>
</div>

<script>
"use strict";

// ---------- 常量 ----------
const COLS = 24, ROWS = 24, CELL = 24;
const W = COLS * CELL, H = ROWS * CELL;
const LEVEL_COUNT = 100;
const PROG_KEY = "gridSnakeProgress";
const BOARD_KEY = "gridSnakeEndlessBoard";
const NAME_KEY = "gridSnakeName";
const ENDLESS_FOOD_SCORE = 20;
const MOVER_CAP = 32;
const MOVER_STEP_TICKS = 2;
const BULLET_CAP = 80;
const PULSE_CYCLE = 10;             // 变形周期:0-6 实心 1 格,7 预警闪烁,8-9 膨胀成十字
const SPAWN_GRACE_TICKS = 20;       // 出生保护:前 20 拍不发射子弹、变形障碍不膨胀

const DIRS = {
  up:    { x: 0, y: -1 },
  down:  { x: 0, y: 1  },
  left:  { x: -1, y: 0 },
  right: { x: 1, y: 0  },
};
const SPAWN = [ { x: 7, y: 12 }, { x: 6, y: 12 }, { x: 5, y: 12 } ];
const SAFE_ZONE = ([x, y]) => y >= 11 && y <= 13 && x >= 3 && x <= 10;

// ---------- 无尽模式 ----------
const ENDLESS_START_OBSTACLES = [
  [4,4],[5,4],[6,4],   [17,4],[18,4],[19,4],
  [4,19],[5,19],[6,19],[17,19],[18,19],[19,19],
];
const ENDLESS_BASE_SPEED = 160, ENDLESS_MIN_SPEED = 90;

// ---------- 画布 ----------
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const dpr = Math.max(1, window.devicePixelRatio || 1);
cv.width = W * dpr;
cv.height = H * dpr;
ctx.scale(dpr, dpr);

// ---------- 本地存储 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
(function migrate() {
  try {
    const old = Number(localStorage.getItem("gridSnakeBest") || 0);
    if (old > 0 && store.get(BOARD_KEY, []).length === 0) {
      store.set(BOARD_KEY, [{ score: old, date: "旧版纪录", name: "玩家" }]);
      store.del("gridSnakeBest");
    }
  } catch {}
})();
function loadProgress() {
  // 进度只增不减:老玩家(旧版玩到第 N 关)的解锁记录原样保留
  const p = store.get(PROG_KEY, null);
  if (p && typeof p.unlocked === "number") return p;
  return { unlocked: 1, endless: false, cleared: [] };
}
function saveProgress(p) { store.set(PROG_KEY, p); }
function loadBoard() { const b = store.get(BOARD_KEY, []); return Array.isArray(b) ? b : []; }
function now() { const d = new Date(); const p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); }
function pushBoard(score) {
  const board = loadBoard();
  const entry = { score, date: now(), name: store.get(NAME_KEY, "玩家") };
  board.push(entry);
  board.sort((a, b) => b.score - a.score);
  const top = board.slice(0, 10);
  store.set(BOARD_KEY, top);
  const rank = top.indexOf(entry);
  return rank === -1 ? 0 : rank + 1;
}

// ---------- 100 关程序化生成 ----------
// 难度梯度(参考开源网格关卡设计的对称图案 + 宽走廊思路):
//   1-10   静物渐增   对称障碍图案,数量与速度逐步上升
//   11-30  障碍移动   引入巡逻横杆,数量逐级上升
//   31-50  变形·弹幕  变形障碍(周期膨胀)+ 炮台发射子弹(41 关起瞄准蛇头)
//   51-100 混合风暴   三种机制叠加,射速/数量/速度全面拉满
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function levelSpec(n) {
  const s = {
    speed: Math.max(95, Math.round(200 - (n - 1) * 1.05)),   // 前 10 关几乎不加速(200→191)
    quota: Math.min(6 + Math.floor((n - 1) / 7), 18),        // 6 → 18,缓慢上升
    movers: 0, turrets: 0, pulses: 0,
    aimed: n >= 45, fireEvery: 12, staticTarget: 0,
  };
  if (n <= 10) {
    // 热身梯度:第 1 关纯空场,障碍从 0 缓慢加到 26 格
    s.staticTarget = [0, 4, 8, 12, 16, 18, 20, 22, 24, 26][n - 1];
  } else if (n <= 30) {
    s.staticTarget = 12 + ((n - 11) % 4) * 3;               // 12 → 21
    s.movers = 2 + Math.floor((n - 11) / 5) * 2;            // 2 → 10
  } else if (n <= 50) {
    s.staticTarget = 10 + ((n - 31) % 4) * 2;               // 10 → 16
    s.pulses = 2 + Math.floor((n - 31) / 6) * 2;            // 2 → 8
    s.turrets = 1 + Math.floor((n - 31) / 6);               // 1 → 4
  } else {
    const k = n - 51;
    s.staticTarget = 12 + (k % 5) * 2;                      // 12 → 20
    s.movers = 4 + Math.floor(k / 12) * 2;                  // 4 → 12
    s.turrets = 3 + Math.floor(k / 10);                     // 3 → 8
    s.pulses = 4 + Math.floor(k / 12) * 2;                  // 4 → 12
    s.fireEvery = Math.max(5, 9 - Math.floor(k / 15));      // 9 → 5
  }
  return s;
}
// 10 种对称图案生成器(密度参数 d = 目标格数)
function patCorners(rng, d) {
  const s = 2 + Math.round(Math.min(2, d / 15));
  const m = 2, cells = [];
  [[m, m], [COLS - m - s, m], [m, ROWS - m - s], [COLS - m - s, ROWS - m - s]].forEach(([x0, y0]) => {
    for (let y = y0; y < y0 + s; y++) for (let x = x0; x < x0 + s; x++) cells.push([x, y]);
  });
  return cells;
}
function patCross(rng) {
  const cx = 11, cy = 11, cells = [];
  const gapY = 8 + Math.floor(rng() * 2);
  for (let y = 3; y < ROWS - 3; y++) {
    if (Math.abs(y - gapY) <= 1) continue;
    cells.push([cx, y], [cx + 1, y]);
  }
  const gapX = 8 + Math.floor(rng() * 2);
  for (let x = 3; x < COLS - 3; x++) {
    if (Math.abs(x - gapX) <= 1) continue;
    cells.push([x, cy], [x, cy + 1]);
  }
  return cells;
}
function patRing() {
  const m = 3, cells = [];
  for (let x = m; x < COLS - m; x++) cells.push([x, m], [x, ROWS - m - 1]);
  for (let y = m; y < ROWS - m; y++) cells.push([m, y], [COLS - m - 1, y]);
  return cells;
}
function patGates(rng) {
  const rows = rng() < 0.5 ? [7, 16] : [6, 12, 18];
  const cells = [];
  rows.forEach(y => {
    for (let x = 3; x <= COLS - 4; x++) {
      if (Math.abs(x - 11.5) < 2.5) continue;
      cells.push([x, y]);
    }
  });
  return cells;
}
function patDots() {
  const cells = [];
  for (let y = 3; y < ROWS - 2; y += 4) for (let x = 4; x < COLS - 2; x += 4) cells.push([x, y]);
  return cells;
}
function patPillars(rng) {
  const cells = [];
  for (let x = 4; x < COLS - 2; x += 5) {
    const top = rng() < 0.5, len = 6 + Math.floor(rng() * 4);
    for (let i = 0; i < len; i++) cells.push([x, top ? 2 + i : ROWS - 3 - i]);
  }
  return cells;
}
function patZigzag() {
  const cells = [];
  for (let i = 0; i < 4; i++) {
    const y = 4 + i * 5, x0 = (i % 2) ? 12 : 2;
    for (let x = x0; x < x0 + 10; x++) cells.push([x, y]);
  }
  return cells;
}
function patDiamond() {
  const cells = [], cx = 11.5, cy = 11.5;
  for (let y = 2; y < ROWS - 2; y++) for (let x = 2; x < COLS - 2; x++) {
    const dist = Math.abs(x + 0.5 - cx) + Math.abs(y + 0.5 - cy);
    if (Math.abs(dist - 8) < 0.6) cells.push([x, y]);
  }
  return cells;
}
function patFrame() {
  const cells = [], m = 2;
  for (let x = m; x < COLS - m; x++) { if (x > 9 && x < 14) continue; cells.push([x, m], [x, ROWS - m - 1]); }
  for (let y = m; y < ROWS - m; y++) { if (y > 9 && y < 14) continue; cells.push([m, y], [COLS - m - 1, y]); }
  for (let y = 6; y < 18; y++) cells.push([11, y], [12, y]);
  return cells;
}
function patCheckers() {
  const cells = [], s = 2;
  for (let y = 3; y < ROWS - 3; y += s * 2) for (let x = 3; x < COLS - 3; x += s * 2)
    for (let dy = 0; dy < s; dy++) for (let dx = 0; dx < s; dx++) cells.push([x + dx, y + dy]);
  return cells;
}
const PATTERN_FNS = [patCorners, patCross, patRing, patGates, patDots, patPillars, patZigzag, patDiamond, patFrame, patCheckers];
const PATTERN_NAMES = ["四角壁垒", "中央十字", "回形边框", "关卡横门", "星点阵", "立柱群", "之字路", "菱形环", "框架辐条", "棋盘块"];

function genStatic(n, rng, target) {
  const idx = Math.floor(rng() * PATTERN_FNS.length);
  let cells = PATTERN_FNS[idx](rng, target);
  const rot = Math.floor(rng() * 4);
  for (let r = 0; r < rot; r++) cells = cells.map(([x, y]) => [COLS - 1 - y, x]);
  const set = new Set();
  cells.forEach(([x, y]) => { if (!SAFE_ZONE([x, y])) set.add(key(x, y)); });
  let arr = [...set].map(k => k.split(",").map(Number));
  while (arr.length > target) arr.splice(Math.floor(rng() * arr.length), 1);
  let guard = 0;
  while (arr.length < target - 3 && guard++ < 200) {
    const x = 2 + Math.floor(rng() * (COLS - 4)), y = 2 + Math.floor(rng() * (ROWS - 4));
    if (SAFE_ZONE([x, y]) || set.has(key(x, y))) continue;
    set.add(key(x, y)); arr.push([x, y]);
  }
  return { cells: arr, name: PATTERN_NAMES[idx] };
}
function genMovers(k, rng, occupied) {
  const out = [];
  let guard = 0;
  while (out.length < k && guard++ < 400) {
    const y = Math.floor(rng() * ROWS);
    if (y >= 10 && y <= 14) continue;
    const len = 2 + Math.floor(rng() * 3);
    const x0 = Math.floor(rng() * (COLS - len));
    const cells = [];
    let ok = true;
    for (let i = 0; i < len; i++) {
      const c = { x: x0 + i, y };
      if (occupied.has(key(c.x, c.y))) { ok = false; break; }
      cells.push(c);
    }
    if (!ok) continue;
    cells.forEach(c => occupied.add(key(c.x, c.y)));
    out.push({ cells, dir: rng() < 0.5 ? 1 : -1 });
  }
  return out;
}
function genTurrets(k, rng, occupied, aimed, fireEvery) {
  const out = [];
  let guard = 0;
  while (out.length < k && guard++ < 400) {
    const x = 2 + Math.floor(rng() * (COLS - 4)), y = 2 + Math.floor(rng() * (ROWS - 4));
    if (SAFE_ZONE([x, y]) || occupied.has(key(x, y))) continue;
    if (Math.abs(x - 7) + Math.abs(y - 12) < 6) continue;   // 离出生点至少 5 格
    occupied.add(key(x, y));
    out.push({
      x, y,
      dir: aimed ? null : DIRS[["up", "down", "left", "right"][Math.floor(rng() * 4)]],
      fireEvery, phase: Math.floor(rng() * fireEvery),
    });
  }
  return out;
}
function genPulses(k, rng, occupied) {
  const out = [];
  let guard = 0;
  while (out.length < k && guard++ < 400) {
    const x = 3 + Math.floor(rng() * (COLS - 6)), y = 3 + Math.floor(rng() * (ROWS - 6));
    if (SAFE_ZONE([x, y]) || occupied.has(key(x, y))) continue;
    occupied.add(key(x, y));
    out.push({ x, y, phase: Math.floor(rng() * PULSE_CYCLE) });
  }
  return out;
}

// ---------- 状态 ----------
let state = "menu";           // menu | playing | paused | levelclear | gameover | victory
let mode = "level";           // level | endless
let snake, dir, dirQueue, food, obstacleSet, level, eaten, quota, score, levelStartScore, tickMs, timer;
let movers = [];              // { cells:[{x,y}], dir }
let turrets = [];             // { x, y, dir|null(瞄准), fireEvery, phase }
let bullets = [];             // { x, y, dx, dy }
let pulses = [];              // { x, y, phase }
let tickCount = 0;
let tierApplied = 0;
let bannerMsg = "", bannerUntil = 0;

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const hud = { score: $("hud-score"), mode: $("hud-mode"), progLabel: $("hud-prog-label"), progress: $("hud-progress") };
const overlay = $("overlay"), ovTitle = $("ov-title"), ovSub = $("ov-sub"), ovBtns = $("ov-btns"), menuEl = $("menu");
const key = (x, y) => x + "," + y;
const wrap = v => (v % COLS + COLS) % COLS;

function updateHUD() {
  hud.score.textContent = score;
  if (mode === "endless") {
    hud.mode.textContent = "无尽模式";
    hud.progLabel.textContent = "下一波";
    hud.progress.textContent = (tierApplied + 1) * 200 + " 分";
  } else {
    hud.mode.textContent = "第 " + level + " 关";
    hud.progLabel.textContent = "进度";
    hud.progress.textContent = eaten + "/" + quota;
  }
  const pad = $("pad-pause");
  if (pad) pad.textContent = state === "paused" ? "▶" : "⏸";
}
function banner(msg) { bannerMsg = msg; bannerUntil = performance.now() + 1800; }

function showOverlay(title, cls, sub, btns) {
  menuEl.style.display = "none";
  ovTitle.style.display = ""; ovSub.style.display = ""; ovBtns.style.display = "";
  ovTitle.textContent = title;
  ovTitle.className = cls || "";
  ovSub.textContent = sub || "";
  ovBtns.innerHTML = "";
  (btns || []).forEach(([label, fn, ghost]) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (ghost) b.className = "ghost";
    b.addEventListener("click", fn);
    ovBtns.appendChild(b);
  });
  overlay.classList.remove("hidden");
}
function hideOverlay() {
  overlay.classList.add("hidden");
  menuEl.style.display = "none";
  ovTitle.style.display = ""; ovSub.style.display = ""; ovBtns.style.display = "";
}

// ---------- 棋面初始化 ----------
function resetBoardState() {
  dir = DIRS.right;
  dirQueue = [];
  snake = SPAWN.map(s => ({ ...s }));
  movers = []; bullets = []; turrets = []; pulses = [];
  obstacleSet = new Set();
  food = null;
}
function loadLevel(n) {
  mode = "level";
  level = n;
  const spec = levelSpec(n);
  tickMs = spec.speed;
  quota = spec.quota;
  eaten = 0;
  levelStartScore = score;
  resetBoardState();
  const rng = mulberry32(n * 2654435761);
  const occupied = new Set();
  const gen = genStatic(n, rng, spec.staticTarget);
  levelPatternName = gen.name;
  gen.cells.forEach(([x, y]) => { obstacleSet.add(key(x, y)); occupied.add(key(x, y)); });
  movers = genMovers(spec.movers, rng, occupied);
  turrets = genTurrets(spec.turrets, rng, occupied, spec.aimed, spec.fireEvery);
  pulses = genPulses(spec.pulses, rng, occupied);
  spawnFood();
}
let levelPatternName = "";
function loadEndless() {
  mode = "endless";
  level = 0;
  tierApplied = 0;
  tickMs = ENDLESS_BASE_SPEED;
  eaten = 0;
  quota = 0;
  levelStartScore = 0;
  levelPatternName = "无尽";
  resetBoardState();
  obstacleSet = new Set(ENDLESS_START_OBSTACLES.map(c => key(c[0], c[1])));
  spawnFood();
}
function moverCellSet() {
  const s = new Set();
  movers.forEach(m => m.cells.forEach(c => s.add(key(c.x, c.y))));
  return s;
}
function pulseSolidSet() {
  const s = new Set();
  if (tickCount < SPAWN_GRACE_TICKS) return s;   // 出生保护期不膨胀
  pulses.forEach(p => {
    const cycle = (tickCount + p.phase) % PULSE_CYCLE;
    if (cycle >= PULSE_CYCLE - 2) {
      [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
        const x = p.x + dx, y = p.y + dy;
        if (x >= 0 && x < COLS && y >= 0 && y < ROWS) s.add(key(x, y));
      });
    }
  });
  return s;
}
function solidTurretSet() {
  const s = new Set();
  turrets.forEach(t => s.add(key(t.x, t.y)));
  return s;
}
function freeCell(x, y) {
  if (obstacleSet.has(key(x, y))) return false;
  if (moverCellSet().has(key(x, y))) return false;
  if (solidTurretSet().has(key(x, y))) return false;
  if (pulses.some(p => p.x === x && p.y === y)) return false;
  if (snake.some(s => s.x === x && s.y === y)) return false;
  if (food && food.x === x && food.y === y) return false;
  return true;
}
function spawnFood() {
  const occ = moverCellSet(), tur = solidTurretSet();
  const free = [], safe = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const k = key(x, y);
    if (obstacleSet.has(k) || occ.has(k) || tur.has(k)) continue;
    if (pulses.some(p => p.x === x && p.y === y)) continue;
    if (snake.some(s => s.x === x && s.y === y)) continue;
    if (food && food.x === x && food.y === y) continue;
    free.push({ x, y });
    // 安全格:至少 2 个可通行邻居(含回卷),保证吃完能全身而退
    let freeN = 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = wrap(x + dx), ny = wrap(y + dy);
      const nk = key(nx, ny);
      if (obstacleSet.has(nk) || occ.has(nk) || tur.has(nk)) continue;
      if (pulses.some(p => p.x === nx && p.y === ny)) continue;
      freeN++;
    }
    if (freeN >= 2) safe.push({ x, y });
  }
  const pool = safe.length ? safe : free;   // 实在没有安全格才退而求其次
  food = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}
function randomFreeCell(avoidSafe) {
  for (let tries = 0; tries < 300; tries++) {
    const x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS);
    if (avoidSafe && SAFE_ZONE([x, y])) continue;
    if (freeCell(x, y)) return [x, y];
  }
  return null;
}

// ---------- 无尽模式档位 ----------
function endlessSpeed() { return Math.max(ENDLESS_MIN_SPEED, ENDLESS_BASE_SPEED - Math.floor(score / 100) * 5); }
function applyTiers() {
  const target = Math.floor(score / 200);
  while (tierApplied < target) {
    tierApplied++;
    const at = tierApplied * 200;
    if (at < 600) {
      addRandomFixed(6);
      banner("难度提升 · 障碍 +6");
    } else if (at === 600) {
      convertToMovers();
      addMovers(4);
      banner("危险!障碍开始移动");
    } else {
      if (movers.length < MOVER_CAP) addMovers(4);
      banner("难度提升 · 移动障碍 +4");
    }
  }
  tickMs = endlessSpeed();
}
function addRandomFixed(n) {
  for (let i = 0; i < n; i++) {
    const c = randomFreeCell(true);
    if (c) obstacleSet.add(key(c[0], c[1]));
  }
  spawnFood();
}
function addMovers(n) {
  for (let i = 0; i < n && movers.length < MOVER_CAP; i++) {
    const c = randomFreeCell(true);
    if (c) movers.push({ cells: [{ x: c[0], y: c[1] }], dir: Math.random() < 0.5 ? 1 : -1 });
  }
  spawnFood();
}
function convertToMovers() {
  const rows = {};
  obstacleSet.forEach(k => {
    const [x, y] = k.split(",").map(Number);
    (rows[y] = rows[y] || []).push(x);
  });
  movers = [];
  Object.keys(rows).forEach(yStr => {
    const y = Number(yStr);
    const xs = rows[yStr].sort((a, b) => a - b);
    let run = [];
    const flush = () => {
      if (run.length) movers.push({ cells: run.map(x => ({ x, y })), dir: movers.length % 2 ? -1 : 1 });
      run = [];
    };
    for (let i = 0; i < xs.length; i++) {
      if (run.length && xs[i] === run[run.length - 1] + 1) run.push(xs[i]);
      else { flush(); run = [xs[i]]; }
    }
    flush();
  });
  obstacleSet = new Set();
  spawnFood();
}
function stepMovers() {
  for (const m of movers) {
    let front;
    if (m.dir > 0) front = Math.max(...m.cells.map(c => c.x));
    else front = Math.min(...m.cells.map(c => c.x));
    if (front + m.dir < 0 || front + m.dir > COLS - 1) m.dir = -m.dir;
    m.cells.forEach(c => { c.x += m.dir; });
    if (m.cells.some(c => c.x === snake[0].x && c.y === snake[0].y)) { gameOver(); return; }
  }
}
function fireTurrets() {
  if (!turrets.length || bullets.length >= BULLET_CAP) return;
  const head = snake[0];
  turrets.forEach(t => {
    if ((tickCount + t.phase) % t.fireEvery !== 0) return;
    let d = t.dir;
    if (!d) { // 瞄准模式:朝蛇头方向(只在开火瞬间取向,直线飞行)
      const dx = head.x - t.x, dy = head.y - t.y;
      d = Math.abs(dx) >= Math.abs(dy) ? { x: Math.sign(dx) || 1, y: 0 } : { x: 0, y: Math.sign(dy) || 1 };
    }
    const bx = t.x + d.x, by = t.y + d.y;
    if (bx < 0 || bx >= COLS || by < 0 || by >= ROWS) return;
    if (obstacleSet.has(key(bx, by))) return;
    bullets.push({ x: bx, y: by, dx: d.x, dy: d.y });
  });
}
function stepBullets() {
  bullets.forEach(b => { b.x += b.dx; b.y += b.dy; });
  bullets = bullets.filter(b =>
    b.x >= 0 && b.x < COLS && b.y >= 0 && b.y < ROWS && !obstacleSet.has(key(b.x, b.y)));
  const head = snake[0];
  if (bullets.some(b => b.x === head.x && b.y === head.y)) { gameOver(); return; }
}

// ---------- 游戏流程 ----------
function beginPlay() {
  state = "playing";
  hideOverlay();
  updateHUD();
  draw();
  scheduleTick();
}
function startLevel(n) {
  score = 0;
  mode = "level";
  loadLevel(n);
  beginPlay();
}
function startEndless() {
  score = 0;
  loadEndless();
  beginPlay();
}
function gotoLevel(n) {
  loadLevel(n);
  beginPlay();
}
function scheduleTick() {
  if (timer) clearTimeout(timer);
  timer = setTimeout(tick, effectiveTickMs());
}
// 长按方向键/屏幕方向键:节拍加快到原来的 1.5 倍
const heldDirs = new Set();
function effectiveTickMs() {
  return heldDirs.size ? Math.max(40, Math.round(tickMs / 1.5)) : tickMs;
}
function tick() {
  timer = null;
  if (state !== "playing") return;
  tickCount++;
  if (dirQueue.length) dir = dirQueue.shift();

  const head = snake[0];
  const nx = wrap(head.x + dir.x), ny = wrap(head.y + dir.y);
  const eating = food && nx === food.x && ny === food.y;
  const body = eating ? snake : snake.slice(0, -1);
  const solid = pulseSolidSet();
  const hitTurret = turrets.some(t => t.x === nx && t.y === ny);
  const hitMover = movers.some(m => m.cells.some(c => c.x === nx && c.y === ny));
  if (obstacleSet.has(key(nx, ny)) || solid.has(key(nx, ny)) || hitTurret || hitMover ||
      body.some(s => s.x === nx && s.y === ny)) {
    gameOver();
    return;
  }
  snake.unshift({ x: nx, y: ny });
  if (eating) {
    eaten++;
    if (mode === "endless") {
      score += ENDLESS_FOOD_SCORE;
      applyTiers();
      spawnFood();
    } else {
      score += 10 * level;
      if (eaten >= quota) { levelClear(); return; }
      spawnFood();
    }
  } else {
    snake.pop();
  }
  if (tickCount % MOVER_STEP_TICKS === 0 && movers.length) {
    stepMovers();
    if (state !== "playing") return;
  }
  if (tickCount >= SPAWN_GRACE_TICKS) fireTurrets();   // 出生保护期内炮台沉默
  stepBullets();
  if (state !== "playing") return;
  updateHUD();
  draw();
  scheduleTick();
}
function gameOver() {
  state = "gameover";
  if (timer) { clearTimeout(timer); timer = null; }
  let rankLine = "";
  if (mode === "endless") {
    const rank = pushBoard(score);
    rankLine = rank > 0 ? "\n冲上本机排行榜第 " + rank + " 名!" : "\n未进入本机排行榜前十";
  }
  updateHUD();
  draw();
  if (mode === "endless") {
    showOverlay("游戏结束", "dead",
      "本局 " + score + " 分" + rankLine,
      [["再来一局", startEndless], ["排行榜", () => openMenu("board"), true], ["主菜单", () => openMenu("levels"), true]]);
  } else {
    showOverlay("游戏结束", "dead",
      "得分 " + score + "\n第 " + level + " 关 · " + levelPatternName,
      [["重试本关", retryLevel], ["返回选关", () => openMenu("levels"), true]]);
  }
}
function retryLevel() {
  score = levelStartScore;
  if (mode === "endless") { startEndless(); return; }
  loadLevel(level);
  beginPlay();
}
function levelClear() {
  state = "levelclear";
  updateHUD();
  draw();
  const prog = loadProgress();
  prog.cleared = Array.from(new Set([...(prog.cleared || []), level]));
  if (level >= prog.unlocked) prog.unlocked = Math.min(LEVEL_COUNT, level + 1);
  if (level >= 5) prog.endless = true;
  saveProgress(prog);
  if (level === LEVEL_COUNT) {
    state = "victory";
    showOverlay("🏆 百关通关!", "win",
      "100 关全部征服,你就是传奇!\n无尽模式等你继续挑战\n总得分 " + score,
      [["进入无尽模式", startEndless], ["返回选关", () => openMenu("levels"), true]]);
  } else {
    const next = level + 1;
    const tierName = next <= 10 ? "静物渐增" : next <= 30 ? "障碍移动" : next <= 50 ? "变形·弹幕" : "混合风暴";
    showOverlay("第 " + level + " 关通过", "win",
      "已解锁第 " + next + " 关 · " + tierName + "\n当前得分 " + score,
      [["继续", () => gotoLevel(next)], ["返回选关", () => openMenu("levels"), true]]);
    timer = setTimeout(() => { if (state === "levelclear") gotoLevel(next); }, 1500);
  }
}
function togglePause() {
  if (state === "playing") {
    state = "paused";
    if (timer) { clearTimeout(timer); timer = null; }
    updateHUD();
    draw();
    showOverlay("已暂停", "pause", "按 空格 继续",
      [["继续", togglePause], ["重开本局", retryLevel, true], ["主菜单", () => openMenu("levels"), true]]);
  } else if (state === "paused") {
    state = "playing";
    hideOverlay();
    updateHUD();
    scheduleTick();
  }
}

// ---------- 主菜单 ----------
let menuTab = "levels";
function openMenu(tab) {
  if (timer) { clearTimeout(timer); timer = null; }
  state = "menu";
  menuTab = tab || menuTab || "levels";

  menuEl.style.display = "flex";

}
function tierOf(n) { return n <= 10 ? 1 : n <= 30 ? 2 : n <= 50 ? 3 : 4; }
function tierName(t) { return ["", "静物渐增 (1-10)", "障碍移动 (11-30)", "变形·弹幕 (31-50)", "混合风暴 (51-100)"][t]; }
function renderMenu() {

  const title = document.createElement("div");

    }
    body.appendChild(legend);
    body.appendChild(grid);
    const note = document.createElement("div");
    note.className = "menu-note";

    body.appendChild(note);
  } else if (menuTab === "endless") {
    const unlocked = !!prog.endless;
    if (unlocked) {
      const best = loadBoard()[0];
      const info = document.createElement("div");

      info.textContent = "本机最佳:" + (best ? best.score + " 分(" + (best.name || "玩家") + ")" : "暂无记录") +
        "\n开局固定障碍 → 每 200 分随机增加障碍 → 600 分起障碍开始沿轨迹移动";
      body.appendChild(info);
      const btn = document.createElement("button");
      btn.textContent = "进入无尽模式";
      btn.addEventListener("click", startEndless);
      body.appendChild(btn);
    } else {
      const info = document.createElement("div");
      info.className = "menu-note";
      info.textContent = "🔒 未解锁\n通关第 5 关后开启\n(无固定关卡,障碍随积分不断升级)";
      body.appendChild(info);
    }
  } else {
    const board = loadBoard();
    const input = document.createElement("input");
    input.className = "board-name";
    input.maxLength = 8;
    input.placeholder = "你的签名";

    input.addEventListener("change", () => store.set(NAME_KEY, input.value.trim() || "玩家"));
    body.appendChild(input);

    list.className = "board-list";
    if (!board.length) {

      list.appendChild(li);

      board.forEach((e, i) => {
        const li = document.createElement("li");
        li.innerHTML = '<span class="rank">' + (i + 1) + '.</span><span class="score">' + e.score + ' 分</span><span class="meta">' + (e.name || "玩家") + " · " + e.date + "</span>";
        list.appendChild(li);
      });
    }
    body.appendChild(list);
    if (board.length) {
      const clr = document.createElement("button");
      clr.className = "ghost";
      clr.textContent = "清空记录";
      clr.addEventListener("click", () => {
        if (confirm("确定清空排行榜?此操作不可恢复。")) { store.del(BOARD_KEY); renderMenu(); }
      });

  menuEl.innerHTML = "";
  menuEl.appendChild(title);
  menuEl.appendChild(sub);
  menuEl.appendChild(tabs);
  menuEl.appendChild(body);
}

// ---------- 绘制 ----------
function draw() {
  ctx.fillStyle = "#10131f";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < COLS; i++) { ctx.moveTo(i * CELL + 0.5, 0); ctx.lineTo(i * CELL + 0.5, H); }
  for (let i = 1; i < ROWS; i++) { ctx.moveTo(0, i * CELL + 0.5); ctx.lineTo(W, i * CELL + 0.5); }
  ctx.stroke();
  // 静止障碍
  obstacleSet.forEach(k => {
    const [x, y] = k.split(",").map(Number);
    drawBlock(x, y, "#3a3f55", "#4a5070");
  });
  // 变形障碍(紫):膨胀时画十字,预警时闪烁
  pulses.forEach(p => {
    const cycle = (tickCount + p.phase) % PULSE_CYCLE;
    if (cycle >= PULSE_CYCLE - 2) {
      ctx.fillStyle = "#a08cff";
      [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
        const x = p.x + dx, y = p.y + dy;
        if (x >= 0 && x < COLS && y >= 0 && y < ROWS) {
          ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
        }
      });
    } else if (cycle === PULSE_CYCLE - 3) {
      if (Math.floor(performance.now() / 90) % 2 === 0) drawBlock(p.x, p.y, "#7a5cd6", "#9d82ff");
      else drawBlock(p.x, p.y, "#4a3f6c", "#5c5080");
    } else {
      drawBlock(p.x, p.y, "#7a5cd6", "#9d82ff");
    }
  });
  // 炮台(红):固定方向画炮口,瞄准型画发光核心
  turrets.forEach(t => {
    drawBlock(t.x, t.y, "#8c2f39", "#c04a52");
    const cx = t.x * CELL + CELL / 2, cy = t.y * CELL + CELL / 2;
    if (t.dir) {
      ctx.fillStyle = "#ffb3a8";
      ctx.fillRect(cx + t.dir.x * 7 - 2.5, cy + t.dir.y * 7 - 2.5, 5, 5);
    } else {
      ctx.fillStyle = Math.floor(performance.now() / 300) % 2 ? "#ffd166" : "#ff8f6b";
      ctx.beginPath();
      ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  // 食物
  if (food) {
    const cx = food.x * CELL + CELL / 2, cy = food.y * CELL + CELL / 2;
    ctx.fillStyle = "#ff5d5d";
    ctx.beginPath();
    ctx.arc(cx, cy + 1, CELL * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffb3b3";
    ctx.beginPath();
    ctx.arc(cx - 3, cy - 2, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  // 移动障碍(琥珀)
  movers.forEach(m => m.cells.forEach(c => drawBlock(c.x, c.y, "#8a6d1f", "#c9a13b")));
  // 蛇
  snake.forEach((s, i) => {
    const pad = i === 0 ? 1 : 2;
    ctx.fillStyle = i === 0 ? "#7ef29d" : i === snake.length - 1 ? "#28a05a" : "#34c26b";
    roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, i === 0 ? 6 : 4);
  });
  const h = snake[0];
  const ex = h.x * CELL + CELL / 2 + dir.x * 4, ey = h.y * CELL + CELL / 2 + dir.y * 4;
  const px = dir.x !== 0 ? 0 : 4, py = dir.x !== 0 ? 4 : 0;
  ctx.fillStyle = "#0a2a14";
  [[1, 1], [-1, -1]].forEach(([a, b]) => {
    ctx.beginPath();
    ctx.arc(ex + px * a, ey + py * b, 2, 0, Math.PI * 2);
    ctx.fill();
  });
  // 子弹(最上层):亮黄小圆 + 光晕
  bullets.forEach(b => {
    const cx = b.x * CELL + CELL / 2, cy = b.y * CELL + CELL / 2;
    ctx.fillStyle = "rgba(255, 209, 102, 0.35)";
    ctx.beginPath();
    ctx.arc(cx, cy, 7.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff3d6";
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();
  });
  // 难度提示横幅
  if (bannerUntil && performance.now() < bannerUntil) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#0a0c18";
    roundRect(W / 2 - 130, H / 2 - 46, 260, 40, 10);
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 16px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(bannerMsg, W / 2, H / 2 - 26);
    ctx.restore();
  }
}
function drawBlock(x, y, base, top) {
  ctx.fillStyle = base;
  ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
  ctx.fillStyle = top;
  ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, 4);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.fill();
}

// ---------- 输入 ----------
function enqueue(d) {
  const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if (d.x === last.x && d.y === last.y) return;
  if (d.x === -last.x && d.y === -last.y) return;
  if (dirQueue.length < 2) dirQueue.push(d);
}
const KEYMAP = {
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
};
document.addEventListener("keydown", e => {
  if (KEYMAP[e.code]) {
    e.preventDefault();
    if (!heldDirs.has(e.code)) {           // 首次按下:进入长按加速(自动重复按键不重复触发)
      heldDirs.add(e.code);
      if (state === "playing") scheduleTick();
    }
    if (state === "playing") enqueue(DIRS[KEYMAP[e.code]]);
    return;
  }
  if (e.code === "Space") {
    e.preventDefault();
    if (state === "playing" || state === "paused") togglePause();
    return;
  }
  if (e.code === "KeyR") {
    if (state === "playing" || state === "paused" || state === "gameover") retryLevel();
    return;
  }
  if (e.code === "Escape") {
    if (state === "paused" || state === "gameover" || state === "levelclear" || state === "victory") openMenu("levels");
  }
});
document.addEventListener("keyup", e => {
  if (KEYMAP[e.code] && heldDirs.delete(e.code) && state === "playing") scheduleTick();
});
window.addEventListener("blur", () => {
  heldDirs.clear();
  if (state === "playing") togglePause();
});

// ---------- 触屏滑动转向 ----------
let touchStart = null;
document.addEventListener("touchstart", e => {
  if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (touchStart) e.preventDefault();
}, { passive: false });
document.addEventListener("touchend", e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  touchStart = null;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if (Math.max(absX, absY) < 20) return;
  if (state !== "playing") return;
  enqueue(absX > absY ? (dx > 0 ? DIRS.right : DIRS.left)
                      : (dy > 0 ? DIRS.down : DIRS.up));
});

// ---------- 触屏方向按钮 ----------
window.addEventListener("touchstart", function showPads() {
  document.getElementById("touch-controls").style.display = "grid";
  window.removeEventListener("touchstart", showPads);
}, { passive: true });
document.querySelectorAll(".pad[data-dir]").forEach(b => {
  b.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (!heldDirs.has("pad")) {              // 按住屏幕方向键同样加速
      heldDirs.add("pad");
      if (state === "playing") scheduleTick();
    }
    if (state === "playing") enqueue(DIRS[b.dataset.dir]);
  });
});
["pointerup", "pointercancel"].forEach(ev => window.addEventListener(ev, () => {
  if (heldDirs.delete("pad") && state === "playing") scheduleTick();
}));
$("pad-pause").addEventListener("pointerdown", e => {
  e.preventDefault();
  if (state === "playing" || state === "paused") togglePause();
});

// ---------- 启动 ----------
obstacleSet = new Set();
loadLevel(1);
openMenu("levels");

// 调试句柄(供自动化测试读取,不影响游戏)
window.game = {
  get state() { return state; },
  get snake() { return snake; },
  get food() { return food; },
  get level() { return level; },
  get eaten() { return eaten; },
  get score() { return score; },
  get dir() { return dir; },
  get mode() { return mode; },
  get pattern() { return levelPatternName; },
  get obstacles() {
    return [...obstacleSet]
      .concat(movers.flatMap(m => m.cells.map(c => c.x + "," + c.y)))
      .concat(turrets.map(t => t.x + "," + t.y))
      .concat(pulses.map(p => p.x + "," + p.y));
  },
  get movers() { return movers.map(m => ({ dir: m.dir, cells: m.cells.map(c => ({ ...c })) })); },
  get turrets() { return turrets.map(t => ({ ...t })); },
  get bullets() { return bullets.map(b => ({ ...b })); },
  get pulses() { return pulses.map(p => ({ ...p })); },
  get progress() { return loadProgress(); },
  get board() { return loadBoard(); },
  _test: {
    startLevel, startEndless, gotoLevel,
    addScore: n => { score += n; if (mode === "endless") { applyTiers(); spawnFood(); } updateHUD(); },
    debugClear: () => { if (mode === "level") { eaten = quota; levelClear(); } },
    rerollFood: () => { spawnFood(); return food; },
  },
};
</script>
</body>

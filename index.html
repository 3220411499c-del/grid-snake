<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>走格子贪吃蛇</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171b2e;
    --line: #262c47;
    --text: #d7dcf0;
    --dim: #8a92b2;
    --green: #34c26b;
    --green-hi: #7ef29d;
    --red: #ff5d5d;
    --amber: #ffd166;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  #wrap { width: min(600px, 96vw); }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 6px;
  }
  h1 { font-size: 20px; letter-spacing: 2px; color: var(--green-hi); }
  #hud { display: flex; gap: 14px; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
  #hud b { color: var(--text); font-size: 14px; }
  #stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
  }
  canvas { display: block; width: 100%; height: auto; border-radius: 6px; touch-action: none; }
  #overlay {
    position: absolute;
    inset: 10px;
    border-radius: 6px;
    background: rgba(10, 12, 24, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 16px;
    overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  #ov-title { font-size: 30px; font-weight: 700; letter-spacing: 4px; }
  #ov-sub { font-size: 14px; color: var(--dim); line-height: 1.9; white-space: pre-line; }
  #ov-title.win { color: var(--green-hi); }
  #ov-title.dead { color: var(--red); }
  #ov-title.pause { color: var(--amber); }
  #ov-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    background: var(--green);
    color: #06240f;
    border: none;
    border-radius: 8px;
    padding: 10px 26px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--green-hi); }
  button.ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--line);
  }
  button.ghost:hover { color: var(--text); border-color: var(--dim); }
  footer {
    margin-top: 10px;
    text-align: center;
    font-size: 12px;
    color: var(--dim);
  }
  footer kbd {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    color: var(--text);
  }
  /* 触屏方向键(仅触屏设备显示) */
  #touch-controls {
    display: none;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 52px);
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
    touch-action: none;
  }
  @media (pointer: coarse) {
    #touch-controls { display: grid; }
    .touch-only { display: inline; }
    .kb-only { display: none; }
  }
  .touch-only { display: none; }
  .pad {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 12px;
    font-size: 26px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
    padding: 0;
  }
  .pad:active { background: var(--green); color: #06240f; }
  .pad.up    { grid-area: 1 / 2; }
  .pad.left  { grid-area: 2 / 1; }
  .pad.center{ grid-area: 2 / 2; font-size: 20px; }
  .pad.right { grid-area: 2 / 3; }
  .pad.down  { grid-area: 3 / 2; }
  /* ---------- 主菜单 ---------- */
  #menu { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 480px; }
  #menu .menu-title { font-size: 28px; font-weight: 700; letter-spacing: 6px; color: var(--green-hi); }
  #menu .menu-sub { font-size: 12px; color: var(--dim); }
  .tabs { display: flex; gap: 8px; }
  .tabs button {
    flex: 1;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 8px 0;
    border-radius: 8px;
    font-size: 14px;
  }
  .tabs button.active { background: var(--green); color: #06240f; border-color: var(--green); }
  .menu-body { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .lv-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 4px;
    color: var(--text);
    cursor: pointer;
    text-align: center;
  }
  .lv-card:hover:not(:disabled) { border-color: var(--green); }
  .lv-card:disabled { opacity: 0.4; cursor: not-allowed; }
  .lv-card.cleared { border-color: var(--green); }
  .lv-card .lv-name { font-weight: 700; font-size: 15px; }
  .lv-card .lv-state { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .menu-note { font-size: 12px; color: var(--dim); line-height: 1.8; }
  .board-list {
    list-style: none;
    text-align: left;
    font-size: 13px;
    line-height: 2.1;
    width: 100%;
    max-height: 240px;
    overflow-y: auto;
  }
  .board-list li .rank { display: inline-block; width: 28px; color: var(--dim); }
  .board-list li:first-child .rank { color: var(--amber); }
  .board-list li .score { font-weight: 700; color: var(--text); }
  .board-list li .meta { color: var(--dim); font-size: 11px; margin-left: 6px; }
  .board-list .empty { color: var(--dim); text-align: center; }
  .board-name {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    width: 150px;
    text-align: center;
    font-family: inherit;
    font-size: 13px;
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>走格子贪吃蛇</h1>
    <div id="hud">
      <span>得分 <b id="hud-score">0</b></span>
      <span id="hud-mode">第 1 关</span>
      <span><span id="hud-prog-label">进度</span> <b id="hud-progress">0/8</b></span>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <div id="menu"></div>
      <div id="ov-title"></div>
      <div id="ov-sub"></div>
      <div id="ov-btns"></div>
    </div>
  </div>
  <div id="touch-controls" aria-label="触屏方向键">
    <button class="pad up" data-dir="up" aria-label="向上">↑</button>
    <button class="pad left" data-dir="left" aria-label="向左">←</button>
    <button class="pad center" id="pad-pause" aria-label="暂停或继续">⏸</button>
    <button class="pad right" data-dir="right" aria-label="向右">→</button>
    <button class="pad down" data-dir="down" aria-label="向下">↓</button>
  </div>
  <footer>
    <span class="kb-only"><kbd>↑↓←→</kbd> / <kbd>WASD</kbd> 转向 ·
    <kbd>空格</kbd> 开始/暂停 · <kbd>R</kbd> 重开 · <kbd>Esc</kbd> 菜单 · </span><span class="touch-only">滑动屏幕或点按钮转向 · 中间键暂停 · </span>边缘穿越回卷,撞到自己或障碍物结束
  </footer>
</div>

<script>
"use strict";

// ---------- 常量 ----------
const COLS = 24, ROWS = 24, CELL = 24;
const W = COLS * CELL, H = ROWS * CELL;
const PROG_KEY = "gridSnakeProgress";
const BOARD_KEY = "gridSnakeEndlessBoard";
const NAME_KEY = "gridSnakeName";
const ENDLESS_FOOD_SCORE = 20;      // 无尽模式每个食物得分
const MOVER_CAP = 32;               // 移动障碍数量上限
const MOVER_STEP_TICKS = 2;         // 移动障碍每 2 拍走 1 格

const DIRS = {
  up:    { x: 0, y: -1 },
  down:  { x: 0, y: 1  },
  left:  { x: -1, y: 0 },
  right: { x: 1, y: 0  },
};

// ---------- 闯关关卡数据(24×24,出生点在第 12 行左侧,均避开) ----------
function rect(x0, y0, x1, y1) {
  const cells = [];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) cells.push([x, y]);
  return cells;
}
const LEVELS = [
  { speed: 200, quota: 8,  obstacles: [] },                                           // 1 热身
  { speed: 180, quota: 8,  obstacles: [                                               // 2 四角方块
      ...rect(2, 2, 4, 4), ...rect(19, 2, 21, 4),
      ...rect(2, 19, 4, 21), ...rect(19, 19, 21, 21),
  ] },
  { speed: 160, quota: 10, obstacles: [                                               // 3 中央十字(留缺口)
      ...rect(11, 4, 12, 8),  ...rect(11, 10, 12, 13), ...rect(11, 15, 12, 19),
      ...rect(4, 10, 8, 11),  ...rect(10, 10, 13, 11), ...rect(15, 10, 19, 11),
  ] },
  { speed: 140, quota: 10, obstacles: [                                               // 4 双横杆(中间留门)
      ...rect(3, 8, 20, 8).filter(([x]) => x < 10 || x > 13),
      ...rect(3, 15, 20, 15).filter(([x]) => x < 10 || x > 13),
  ] },
  { speed: 120, quota: 12, obstacles: [                                               // 5 散点障碍阵
      [5,5],[18,5],[5,18],[18,18],
      [11,3],[12,3],[11,20],[12,20],
      [2,8],[21,8],[2,15],[21,15],
      [9,8],[14,8],[9,15],[14,15],
  ] },
];
const SPAWN = [ // 出生:头在前,向右移动(y=12 一行,所有关卡障碍均避开)
  { x: 7, y: 12 }, { x: 6, y: 12 }, { x: 5, y: 12 },
];

// ---------- 无尽模式 ----------
const ENDLESS_START_OBSTACLES = [  // 开局固定障碍:四条 3 格横杆
  [4,4],[5,4],[6,4],   [17,4],[18,4],[19,4],
  [4,19],[5,19],[6,19],[17,19],[18,19],[19,19],
];
const ENDLESS_BASE_SPEED = 160, ENDLESS_MIN_SPEED = 90;
const SAFE_ZONE = ([x, y]) => y >= 11 && y <= 13 && x >= 3 && x <= 10; // 出生安全区

// ---------- 画布 ----------
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const dpr = Math.max(1, window.devicePixelRatio || 1);
cv.width = W * dpr;
cv.height = H * dpr;
ctx.scale(dpr, dpr);

// ---------- 本地存储 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
(function migrate() { // 旧版最高分 → 排行榜种子
  try {
    const old = Number(localStorage.getItem("gridSnakeBest") || 0);
    if (old > 0 && store.get(BOARD_KEY, []).length === 0) {
      store.set(BOARD_KEY, [{ score: old, date: "旧版纪录", name: "玩家" }]);
      store.del("gridSnakeBest");
    }
  } catch {}
})();
function loadProgress() {
  const p = store.get(PROG_KEY, null);
  return p && typeof p.unlocked === "number" ? p : { unlocked: 1, endless: false, cleared: [] };
}
function saveProgress(p) { store.set(PROG_KEY, p); }
function loadBoard() { const b = store.get(BOARD_KEY, []); return Array.isArray(b) ? b : []; }
function now() { const d = new Date(); const p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); }
function pushBoard(score) {
  const board = loadBoard();
  const entry = { score, date: now(), name: store.get(NAME_KEY, "玩家") };
  board.push(entry);
  board.sort((a, b) => b.score - a.score);
  const top = board.slice(0, 10);
  store.set(BOARD_KEY, top);
  const rank = top.indexOf(entry);
  return rank === -1 ? 0 : rank + 1;   // 0 = 未进前十
}

// ---------- 状态 ----------
let state = "menu";           // menu | playing | paused | levelclear | gameover | victory
let mode = "level";           // level | endless
let snake, dir, dirQueue, food, obstacleSet, level, eaten, quota, score, levelStartScore, tickMs, timer;
let movers = [];              // 移动障碍:{ cells:[{x,y}], dir }  dir=±1(水平巡逻)
let tickCount = 0;
let tierApplied = 0;          // 已触发的无尽档位数
let bannerMsg = "", bannerUntil = 0;

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const hud = { score: $("hud-score"), mode: $("hud-mode"), progLabel: $("hud-prog-label"), progress: $("hud-progress") };
const overlay = $("overlay"), ovTitle = $("ov-title"), ovSub = $("ov-sub"), ovBtns = $("ov-btns"), menuEl = $("menu");
const key = (x, y) => x + "," + y;
const wrap = v => (v % COLS + COLS) % COLS;

function updateHUD() {
  hud.score.textContent = score;
  if (mode === "endless") {
    hud.mode.textContent = "无尽模式";
    hud.progLabel.textContent = "下一波";
    hud.progress.textContent = (tierApplied + 1) * 200 + " 分";
  } else {
    hud.mode.textContent = "第 " + level + " 关";
    hud.progLabel.textContent = "进度";
    hud.progress.textContent = eaten + "/" + quota;
  }
  const pad = $("pad-pause");
  if (pad) pad.textContent = state === "paused" ? "▶" : "⏸";
}
function banner(msg) { bannerMsg = msg; bannerUntil = performance.now() + 1800; }

function showOverlay(title, cls, sub, btns) {
  menuEl.style.display = "none";
  ovTitle.style.display = ""; ovSub.style.display = ""; ovBtns.style.display = "";
  ovTitle.textContent = title;
  ovTitle.className = cls || "";
  ovSub.textContent = sub || "";
  ovBtns.innerHTML = "";
  (btns || []).forEach(([label, fn, ghost]) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (ghost) b.className = "ghost";
    b.addEventListener("click", fn);
    ovBtns.appendChild(b);
  });
  overlay.classList.remove("hidden");
}
function hideOverlay() {
  overlay.classList.add("hidden");
  menuEl.style.display = "none";
  ovTitle.style.display = ""; ovSub.style.display = ""; ovBtns.style.display = "";
}

// ---------- 关卡 ----------
function loadLevel(n) {
  mode = "level";
  level = n;
  const cfg = LEVELS[n - 1];
  tickMs = cfg.speed;
  quota = cfg.quota;
  eaten = 0;
  levelStartScore = score;
  resetBoardState(cfg.obstacles || []);
}
function loadEndless() {
  mode = "endless";
  level = 0;
  tierApplied = 0;
  tickMs = ENDLESS_BASE_SPEED;
  eaten = 0;
  quota = 0;
  levelStartScore = 0;
  resetBoardState(ENDLESS_START_OBSTACLES.map(c => c.slice()));
}
function resetBoardState(obstacleCells) {
  dir = DIRS.right;
  dirQueue = [];
  snake = SPAWN.map(s => ({ ...s }));
  movers = [];
  obstacleSet = new Set(obstacleCells.map(([x, y]) => key(x, y)));
  food = null;
  spawnFood();
}
function moverCellSet() {
  const s = new Set();
  movers.forEach(m => m.cells.forEach(c => s.add(key(c.x, c.y))));
  return s;
}
function freeCell(x, y) {
  if (obstacleSet.has(key(x, y))) return false;
  if (snake.some(s => s.x === x && s.y === y)) return false;
  if (food && food.x === x && food.y === y) return false;
  if (moverCellSet().has(key(x, y))) return false;
  return true;
}
function spawnFood() {
  const free = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
    if (freeCell(x, y)) free.push({ x, y });
  food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
}
function randomFreeCell(avoidSafe) {
  for (let tries = 0; tries < 300; tries++) {
    const x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS);
    if (avoidSafe && SAFE_ZONE([x, y])) continue;
    if (freeCell(x, y)) return [x, y];
  }
  return null;
}

// ---------- 无尽模式档位 ----------
// 每跨过 200 分触发一档:200/400 加固定障碍;600 起障碍全部转为移动障碍;
// 之后每档再增加移动障碍(至上限)。
function endlessSpeed() { return Math.max(ENDLESS_MIN_SPEED, ENDLESS_BASE_SPEED - Math.floor(score / 100) * 5); }
function applyTiers() {
  const target = Math.floor(score / 200);
  while (tierApplied < target) {
    tierApplied++;
    const at = tierApplied * 200;
    if (at < 600) {
      addRandomFixed(6);
      banner("难度提升 · 障碍 +6");
    } else if (at === 600) {
      convertToMovers();
      addMovers(4);
      banner("危险!障碍开始移动");
    } else {
      if (movers.length < MOVER_CAP) addMovers(4);
      banner("难度提升 · 移动障碍 +4");
    }
  }
  tickMs = endlessSpeed();
}
function addRandomFixed(n) {
  for (let i = 0; i < n; i++) {
    const c = randomFreeCell(true);
    if (c) obstacleSet.add(key(c[0], c[1]));
  }
  spawnFood();
}
function addMovers(n) {
  for (let i = 0; i < n && movers.length < MOVER_CAP; i++) {
    const c = randomFreeCell(true);
    if (c) movers.push({ cells: [{ x: c[0], y: c[1] }], dir: Math.random() < 0.5 ? 1 : -1 });
  }
  spawnFood();
}
function convertToMovers() { // 静止障碍按"同一行的连续段"整段转为水平巡逻障碍
  const rows = {};
  obstacleSet.forEach(k => {
    const [x, y] = k.split(",").map(Number);
    (rows[y] = rows[y] || []).push(x);
  });
  movers = [];
  Object.keys(rows).forEach(yStr => {
    const y = Number(yStr);
    const xs = rows[yStr].sort((a, b) => a - b);
    let run = [];
    const flush = () => {
      if (run.length) movers.push({ cells: run.map(x => ({ x, y })), dir: movers.length % 2 ? -1 : 1 });
      run = [];
    };
    for (let i = 0; i < xs.length; i++) {
      if (run.length && xs[i] === run[run.length - 1] + 1) run.push(xs[i]);
      else { flush(); run = [xs[i]]; }
    }
    flush();
  });
  obstacleSet = new Set();
  spawnFood();
}
function stepMovers() { // 每 2 拍走 1 格,撞墙反弹;走进蛇头 → 游戏结束
  for (const m of movers) {
    let front;
    if (m.dir > 0) front = Math.max(...m.cells.map(c => c.x));
    else front = Math.min(...m.cells.map(c => c.x));
    if (front + m.dir < 0 || front + m.dir > COLS - 1) m.dir = -m.dir;
    m.cells.forEach(c => { c.x += m.dir; });
    if (m.cells.some(c => c.x === snake[0].x && c.y === snake[0].y)) { gameOver(); return; }
  }
}

// ---------- 游戏流程 ----------
function beginPlay() {
  state = "playing";
  hideOverlay();
  updateHUD();
  draw();
  scheduleTick();
}
function startLevel(n) {          // 从选关进入(新开一局)
  score = 0;
  mode = "level";
  loadLevel(n);
  beginPlay();
}
function startEndless() {
  score = 0;
  loadEndless();
  beginPlay();
}
function gotoLevel(n) {           // 闯关中进入下一关(保留得分)
  loadLevel(n);
  beginPlay();
}
function scheduleTick() {
  if (timer) clearTimeout(timer);
  timer = setTimeout(tick, tickMs);
}
function tick() {
  timer = null;
  if (state !== "playing") return;
  tickCount++;
  if (dirQueue.length) dir = dirQueue.shift();

  const head = snake[0];
  const nx = wrap(head.x + dir.x), ny = wrap(head.y + dir.y);
  const eating = food && nx === food.x && ny === food.y;
  const body = eating ? snake : snake.slice(0, -1);
  const hitMover = movers.some(m => m.cells.some(c => c.x === nx && c.y === ny));
  if (obstacleSet.has(key(nx, ny)) || hitMover || body.some(s => s.x === nx && s.y === ny)) {
    gameOver();
    return;
  }
  snake.unshift({ x: nx, y: ny });
  if (eating) {
    eaten++;
    if (mode === "endless") {
      score += ENDLESS_FOOD_SCORE;
      applyTiers();
      spawnFood();
    } else {
      score += 10 * level;
      if (eaten >= quota) { levelClear(); return; }
      spawnFood();
    }
  } else {
    snake.pop();
  }
  if (tickCount % MOVER_STEP_TICKS === 0 && movers.length) {
    stepMovers();
    if (state !== "playing") return;   // 移动障碍撞上蛇头
  }
  updateHUD();
  draw();
  scheduleTick();
}
function gameOver() {
  state = "gameover";
  if (timer) { clearTimeout(timer); timer = null; }
  let rankLine = "";
  if (mode === "endless") {
    const rank = pushBoard(score);
    rankLine = rank > 0 ? "\n冲上本机排行榜第 " + rank + " 名!" : "\n未进入本机排行榜前十";
  }
  updateHUD();
  draw();
  if (mode === "endless") {
    showOverlay("游戏结束", "dead",
      "本局 " + score + " 分" + rankLine,
      [["再来一局", startEndless], ["排行榜", () => openMenu("board"), true], ["主菜单", () => openMenu("levels"), true]]);
  } else {
    showOverlay("游戏结束", "dead",
      "得分 " + score + "\n第 " + level + " 关 · 吃了 " + eaten + "/" + quota + " 个食物",
      [["重试本关", retryLevel], ["返回选关", () => openMenu("levels"), true]]);
  }
}
function retryLevel() {
  score = levelStartScore;
  if (mode === "endless") { startEndless(); return; }
  loadLevel(level);
  beginPlay();
}
function levelClear() {
  state = "levelclear";
  updateHUD();
  draw();
  const prog = loadProgress();
  prog.cleared = Array.from(new Set([...(prog.cleared || []), level]));
  if (level >= prog.unlocked) prog.unlocked = Math.min(LEVELS.length, level + 1);
  if (level === LEVELS.length) prog.endless = true;
  saveProgress(prog);
  if (level === LEVELS.length) {
    state = "victory";
    showOverlay("🎉 全部通关!", "win",
      "无尽模式已解锁!\n当前得分 " + score,
      [["进入无尽模式", startEndless], ["返回选关", () => openMenu("levels"), true]]);
  } else {
    const next = level + 1;
    showOverlay("第 " + level + " 关通过", "win",
      "第 " + next + " 关已解锁 · 速度加快\n当前得分 " + score,
      [["继续", () => gotoLevel(next)], ["返回选关", () => openMenu("levels"), true]]);
    timer = setTimeout(() => { if (state === "levelclear") gotoLevel(next); }, 1500);
  }
}
function togglePause() {
  if (state === "playing") {
    state = "paused";
    if (timer) { clearTimeout(timer); timer = null; }
    updateHUD();
    draw();
    showOverlay("已暂停", "pause", "按 空格 继续",
      [["继续", togglePause], ["重开本局", retryLevel, true], ["主菜单", () => openMenu("levels"), true]]);
  } else if (state === "paused") {
    state = "playing";
    hideOverlay();
    updateHUD();
    scheduleTick();
  }
}

// ---------- 主菜单 ----------
let menuTab = "levels";
function openMenu(tab) {
  if (timer) { clearTimeout(timer); timer = null; }
  state = "menu";
  menuTab = tab || menuTab || "levels";
  ovTitle.style.display = "none"; ovSub.style.display = "none"; ovBtns.style.display = "none";
  menuEl.style.display = "flex";
  overlay.classList.remove("hidden");
  updateHUD();
  renderMenu();
}
function renderMenu() {
  const prog = loadProgress();
  const tabs = document.createElement("div");
  tabs.className = "tabs";
  [["levels", "闯关模式"], ["endless", "无尽模式"], ["board", "排行榜"]].forEach(([id, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (menuTab === id) b.className = "active";
    b.addEventListener("click", () => { menuTab = id; renderMenu(); });
    tabs.appendChild(b);
  });
  const body = document.createElement("div");
  body.className = "menu-body";
  const title = document.createElement("div");
  title.className = "menu-title";
  title.textContent = "走格子贪吃蛇";
  const sub = document.createElement("div");
  sub.className = "menu-sub";
  sub.textContent = "蛇每拍自动走一格 · 边缘回卷 · 撞自己或障碍结束";

  if (menuTab === "levels") {
    const grid = document.createElement("div");
    grid.className = "level-grid";
    for (let n = 1; n <= LEVELS.length; n++) {
      const card = document.createElement("button");
      card.className = "lv-card";
      const locked = n > prog.unlocked;
      const cleared = (prog.cleared || []).includes(n);
      if (cleared) card.classList.add("cleared");
      card.disabled = locked;
      const name = document.createElement("div");
      name.className = "lv-name";
      name.textContent = "第 " + n + " 关";
      const st = document.createElement("div");
      st.className = "lv-state";
      st.textContent = locked ? "🔒 通关上一关解锁" : cleared ? "✓ 已通关" : LEVELS[n - 1].speed + "ms/格";
      card.appendChild(name); card.appendChild(st);
      if (!locked) card.addEventListener("click", () => startLevel(n));
      grid.appendChild(card);
    }
    body.appendChild(grid);
    const note = document.createElement("div");
    note.className = "menu-note";
    note.textContent = "通关当前关卡即可解锁下一关,通关第 5 关解锁无尽模式";
    body.appendChild(note);
  } else if (menuTab === "endless") {
    const unlocked = !!prog.endless;
    if (unlocked) {
      const best = loadBoard()[0];
      const info = document.createElement("div");
      info.className = "menu-note";
      info.textContent = "本机最佳:" + (best ? best.score + " 分(" + (best.name || "玩家") + ")" : "暂无记录") +
        "\n开局固定障碍 → 每 200 分随机增加障碍 → 600 分起障碍开始沿轨迹移动";
      body.appendChild(info);
      const btn = document.createElement("button");
      btn.textContent = "进入无尽模式";
      btn.addEventListener("click", startEndless);
      body.appendChild(btn);
    } else {
      const info = document.createElement("div");
      info.className = "menu-note";
      info.textContent = "🔒 未解锁\n通关第 5 关后开启\n(无固定关卡,障碍随积分不断升级)";
      body.appendChild(info);
    }
  } else {
    const board = loadBoard();
    const input = document.createElement("input");
    input.className = "board-name";
    input.maxLength = 8;
    input.placeholder = "你的签名";
    input.value = store.get(NAME_KEY, "玩家");
    input.addEventListener("change", () => store.set(NAME_KEY, input.value.trim() || "玩家"));
    body.appendChild(input);
    const list = document.createElement("ol");
    list.className = "board-list";
    if (!board.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "暂无记录 · 去无尽模式创造第一个纪录吧";
      list.appendChild(li);
    } else {
      board.forEach((e, i) => {
        const li = document.createElement("li");
        li.innerHTML = '<span class="rank">' + (i + 1) + '.</span><span class="score">' + e.score + ' 分</span><span class="meta">' + (e.name || "玩家") + " · " + e.date + "</span>";
        list.appendChild(li);
      });
    }
    body.appendChild(list);
    if (board.length) {
      const clr = document.createElement("button");
      clr.className = "ghost";
      clr.textContent = "清空记录";
      clr.addEventListener("click", () => {
        if (confirm("确定清空排行榜?此操作不可恢复。")) { store.del(BOARD_KEY); renderMenu(); }
      });
      body.appendChild(clr);
    }
  }
  menuEl.innerHTML = "";
  menuEl.appendChild(title);
  menuEl.appendChild(sub);
  menuEl.appendChild(tabs);
  menuEl.appendChild(body);
}

// ---------- 绘制 ----------
function draw() {
  ctx.fillStyle = "#10131f";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < COLS; i++) { ctx.moveTo(i * CELL + 0.5, 0); ctx.lineTo(i * CELL + 0.5, H); }
  for (let i = 1; i < ROWS; i++) { ctx.moveTo(0, i * CELL + 0.5); ctx.lineTo(W, i * CELL + 0.5); }
  ctx.stroke();
  // 静止障碍
  obstacleSet.forEach(k => {
    const [x, y] = k.split(",").map(Number);
    drawBlock(x, y, "#3a3f55", "#4a5070");
  });
  // 食物
  if (food) {
    const cx = food.x * CELL + CELL / 2, cy = food.y * CELL + CELL / 2;
    ctx.fillStyle = "#ff5d5d";
    ctx.beginPath();
    ctx.arc(cx, cy + 1, CELL * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffb3b3";
    ctx.beginPath();
    ctx.arc(cx - 3, cy - 2, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  // 移动障碍(琥珀色)
  movers.forEach(m => m.cells.forEach(c => drawBlock(c.x, c.y, "#8a6d1f", "#c9a13b")));
  // 蛇
  snake.forEach((s, i) => {
    const pad = i === 0 ? 1 : 2;
    ctx.fillStyle = i === 0 ? "#7ef29d" : i === snake.length - 1 ? "#28a05a" : "#34c26b";
    roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, i === 0 ? 6 : 4);
  });
  const h = snake[0];
  const ex = h.x * CELL + CELL / 2 + dir.x * 4, ey = h.y * CELL + CELL / 2 + dir.y * 4;
  const px = dir.x !== 0 ? 0 : 4, py = dir.x !== 0 ? 4 : 0;
  ctx.fillStyle = "#0a2a14";
  [[1, 1], [-1, -1]].forEach(([a, b]) => {
    ctx.beginPath();
    ctx.arc(ex + px * a, ey + py * b, 2, 0, Math.PI * 2);
    ctx.fill();
  });
  // 难度提示横幅
  if (bannerUntil && performance.now() < bannerUntil) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#0a0c18";
    roundRect(W / 2 - 130, H / 2 - 46, 260, 40, 10);
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 16px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(bannerMsg, W / 2, H / 2 - 26);
    ctx.restore();
  }
}
function drawBlock(x, y, base, top) {
  ctx.fillStyle = base;
  ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
  ctx.fillStyle = top;
  ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, 4);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.fill();
}

// ---------- 输入 ----------
function enqueue(d) {
  const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if (d.x === last.x && d.y === last.y) return;
  if (d.x === -last.x && d.y === -last.y) return;
  if (dirQueue.length < 2) dirQueue.push(d);
}
const KEYMAP = {
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
};
document.addEventListener("keydown", e => {
  if (KEYMAP[e.code]) {
    e.preventDefault();
    if (state === "playing") enqueue(DIRS[KEYMAP[e.code]]);
    return;
  }
  if (e.code === "Space") {
    e.preventDefault();
    if (state === "playing" || state === "paused") togglePause();
    return;
  }
  if (e.code === "KeyR") {
    if (state === "playing" || state === "paused" || state === "gameover") retryLevel();
    return;
  }
  if (e.code === "Escape") {
    if (state === "paused" || state === "gameover" || state === "levelclear" || state === "victory") openMenu("levels");
  }
});
window.addEventListener("blur", () => { if (state === "playing") togglePause(); });

// ---------- 触屏滑动转向 ----------
let touchStart = null;
document.addEventListener("touchstart", e => {
  if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (touchStart) e.preventDefault();
}, { passive: false });
document.addEventListener("touchend", e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  touchStart = null;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if (Math.max(absX, absY) < 20) return;
  if (state !== "playing") return;
  enqueue(absX > absY ? (dx > 0 ? DIRS.right : DIRS.left)
                      : (dy > 0 ? DIRS.down : DIRS.up));
});

// ---------- 触屏方向按钮 ----------
// 保险:即使 pointer:coarse 媒体查询失效,一旦发生触摸也显示方向键
window.addEventListener("touchstart", function showPads() {
  document.getElementById("touch-controls").style.display = "grid";
  window.removeEventListener("touchstart", showPads);
}, { passive: true });
document.querySelectorAll(".pad[data-dir]").forEach(b => {
  b.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (state === "playing") enqueue(DIRS[b.dataset.dir]);
  });
});
$("pad-pause").addEventListener("pointerdown", e => {
  e.preventDefault();
  if (state === "playing" || state === "paused") togglePause();
});

// ---------- 启动 ----------
loadLevel(1);      // 作为菜单背景
openMenu("levels");

// 调试句柄(供自动化测试读取,不影响游戏)
window.game = {
  get state() { return state; },
  get snake() { return snake; },
  get food() { return food; },
  get level() { return level; },
  get eaten() { return eaten; },
  get score() { return score; },
  get dir() { return dir; },
  get mode() { return mode; },
  get obstacles() { return [...obstacleSet].concat(movers.flatMap(m => m.cells.map(c => c.x + "," + c.y))); },
  get movers() { return movers.map(m => ({ dir: m.dir, cells: m.cells.map(c => ({ ...c })) })); },
  get progress() { return loadProgress(); },
  get board() { return loadBoard(); },
  _test: { startLevel, startEndless, gotoLevel, addScore: n => { score += n; if (mode === "endless") { applyTiers(); spawnFood(); } updateHUD(); } },
};
</script>
</body>

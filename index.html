<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>走格子贪吃蛇</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171b2e;
    --line: #262c47;
    --text: #d7dcf0;
    --dim: #8a92b2;
    --green: #34c26b;
    --green-hi: #7ef29d;
    --red: #ff5d5d;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  #wrap { width: min(600px, 96vw); }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 6px;
  }
  h1 { font-size: 20px; letter-spacing: 2px; color: var(--green-hi); }
  #hud { display: flex; gap: 14px; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
  #hud b { color: var(--text); font-size: 14px; }
  #hud .best b { color: var(--accent); }
  #stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
  }
  canvas { display: block; width: 100%; height: auto; border-radius: 6px; touch-action: none; }
  #overlay {
    position: absolute;
    inset: 10px;
    border-radius: 6px;
    background: rgba(10, 12, 24, 0.82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #ov-title { font-size: 30px; font-weight: 700; letter-spacing: 4px; }
  #ov-sub { font-size: 14px; color: var(--dim); line-height: 1.9; white-space: pre-line; }
  #ov-title.win { color: var(--green-hi); }
  #ov-title.dead { color: var(--red); }
  #ov-title.pause { color: var(--accent); }
  button {
    background: var(--green);
    color: #06240f;
    border: none;
    border-radius: 8px;
    padding: 10px 26px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--green-hi); }
  button.ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--line);
  }
  button.ghost:hover { color: var(--text); border-color: var(--dim); }
  #ov-btns { display: flex; gap: 10px; }
  footer {
    margin-top: 10px;
    text-align: center;
    font-size: 12px;
    color: var(--dim);
  }
  footer kbd {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    color: var(--text);
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>走格子贪吃蛇</h1>
    <div id="hud">
      <span>得分 <b id="hud-score">0</b></span>
      <span>第 <b id="hud-level">1</b> 关</span>
      <span>进度 <b id="hud-progress">0/8</b></span>
      <span class="best">最高分 <b id="hud-best">0</b></span>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <div id="ov-title"></div>
      <div id="ov-sub"></div>
      <div id="ov-btns"></div>
    </div>
  </div>
  <footer>
    <kbd>↑↓←→</kbd> / <kbd>WASD</kbd> 转向 ·
    <kbd>空格</kbd> 开始/暂停 · <kbd>R</kbd> 重开本关 · 📱 滑动屏幕转向
    · 边缘穿越回卷,撞到自己或障碍物结束
  </footer>
</div>

<script>
"use strict";

// ---------- 常量 ----------
const COLS = 24, ROWS = 24, CELL = 24;
const W = COLS * CELL, H = ROWS * CELL;
const STORE_KEY = "gridSnakeBest";

// 方向
const DIRS = {
  up:    { x: 0, y: -1 },
  down:  { x: 0, y: 1  },
  left:  { x: -1, y: 0 },
  right: { x: 1, y: 0  },
};

// ---------- 关卡数据(24×24,出生点在第 12 行左侧,均避开) ----------
function rect(x0, y0, x1, y1) {
  const cells = [];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) cells.push([x, y]);
  return cells;
}
const LEVELS = [
  { speed: 200, quota: 8, obstacles: [] },                                            // 1 热身
  { speed: 180, quota: 8,  obstacles: [                                               // 2 四角方块
      ...rect(2, 2, 4, 4), ...rect(19, 2, 21, 4),
      ...rect(2, 19, 4, 21), ...rect(19, 19, 21, 21),
  ] },
  { speed: 160, quota: 10, obstacles: [                                               // 3 中央十字(留缺口)
      ...rect(11, 4, 12, 8),  ...rect(11, 10, 12, 13), ...rect(11, 15, 12, 19),
      ...rect(4, 10, 8, 11),  ...rect(10, 10, 13, 11), ...rect(15, 10, 19, 11),
  ] },
  { speed: 140, quota: 10, obstacles: [                                               // 4 双横杆(中间留门)
      ...rect(3, 8, 20, 8).filter(([x]) => x < 10 || x > 13),
      ...rect(3, 15, 20, 15).filter(([x]) => x < 10 || x > 13),
  ] },
  { speed: 120, quota: 12, obstacles: [                                               // 5 散点障碍阵
      [5,5],[18,5],[5,18],[18,18],
      [11,3],[12,3],[11,20],[12,20],
      [2,8],[21,8],[2,15],[21,15],
      [9,8],[14,8],[9,15],[14,15],
  ] },
];
const SPAWN = [ // 出生:头在前,向右移动(y=12 一行,所有关卡障碍均避开)
  { x: 7, y: 12 }, { x: 6, y: 12 }, { x: 5, y: 12 },
];
const ENDLESS_OBSTACLES = 16;

// ---------- 画布 ----------
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const dpr = Math.max(1, window.devicePixelRatio || 1);
cv.width = W * dpr;
cv.height = H * dpr;
ctx.scale(dpr, dpr);

// ---------- 状态 ----------
let state = "start";          // start | playing | paused | levelclear | gameover | victory
let snake, dir, dirQueue, food, obstacleSet, level, eaten, quota, score, levelStartScore, tickMs, timer, best;

best = Number(localStorage.getItem(STORE_KEY) || 0);

// ---------- 工具 ----------
const key = (x, y) => x + "," + y;
const wrap = v => (v % COLS + COLS) % COLS;
const snakeKey = s => key(s.x, s.y);

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const hud = { score: $("hud-score"), level: $("hud-level"), progress: $("hud-progress"), best: $("hud-best") };
const overlay = $("overlay"), ovTitle = $("ov-title"), ovSub = $("ov-sub"), ovBtns = $("ov-btns");

function updateHUD() {
  hud.score.textContent = score;
  hud.level.textContent = level;
  hud.progress.textContent = eaten + "/" + quota;
  hud.best.textContent = best;
}
function showOverlay(title, cls, sub, btns) {
  ovTitle.textContent = title;
  ovTitle.className = cls || "";
  ovSub.textContent = sub || "";
  ovBtns.innerHTML = "";
  (btns || []).forEach(([label, fn, ghost]) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (ghost) b.className = "ghost";
    b.addEventListener("click", fn);
    ovBtns.appendChild(b);
  });
  overlay.classList.remove("hidden");
}
function hideOverlay() { overlay.classList.add("hidden"); }

// ---------- 关卡 ----------
function endlessLevel(n) {
  return {
    speed: Math.max(80, 120 - (n - 5) * 10),
    quota: 12,
    obstacles: null, // 随机生成
  };
}
function loadLevel(n) {
  level = n;
  const cfg = n <= LEVELS.length ? LEVELS[n - 1] : endlessLevel(n);
  tickMs = cfg.speed;
  quota = cfg.quota;
  eaten = 0;
  levelStartScore = score;
  dir = DIRS.right;
  dirQueue = [];
  snake = SPAWN.map(s => ({ ...s }));

  obstacleSet = new Set();
  let cells = cfg.obstacles;
  if (!cells) { // 无尽关:随机障碍,避开出生带
    cells = [];
    const taken = new Set();
    while (cells.length < ENDLESS_OBSTACLES) {
      const x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS);
      const k = key(x, y);
      if (taken.has(k)) continue;
      if (y >= 11 && y <= 13 && x >= 3 && x <= 10) continue; // 出生安全区
      taken.add(k);
      cells.push([x, y]);
    }
  }
  cells.forEach(([x, y]) => obstacleSet.add(key(x, y)));
  spawnFood();
}
function freeCell(x, y) {
  return !obstacleSet.has(key(x, y)) && !snake.some(s => s.x === x && s.y === y) &&
         !(food && food.x === x && food.y === y);
}
function spawnFood() {
  const free = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
    if (freeCell(x, y)) free.push({ x, y });
  food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
}

// ---------- 游戏流程 ----------
function startGame() {
  score = 0;
  loadLevel(1);
  state = "playing";
  hideOverlay();
  updateHUD();
  scheduleTick();
}
function scheduleTick() {
  if (timer) clearTimeout(timer);
  timer = setTimeout(tick, tickMs);
}
function tick() {
  timer = null;
  if (state !== "playing") return;
  if (dirQueue.length) dir = dirQueue.shift();

  const head = snake[0];
  const nx = wrap(head.x + dir.x), ny = wrap(head.y + dir.y);
  const eating = food && nx === food.x && ny === food.y;
  // 不吃时尾巴会让位,该格安全
  const body = eating ? snake : snake.slice(0, -1);
  if (obstacleSet.has(key(nx, ny)) || body.some(s => s.x === nx && s.y === ny)) {
    gameOver();
    return;
  }
  snake.unshift({ x: nx, y: ny });
  if (eating) {
    eaten++;
    score += 10 * level;
    if (eaten >= quota) { levelClear(); return; }
    spawnFood();
  } else {
    snake.pop();
  }
  updateHUD();
  draw();
  scheduleTick();
}
function gameOver() {
  state = "gameover";
  if (timer) { clearTimeout(timer); timer = null; }
  if (score > best) { best = score; localStorage.setItem(STORE_KEY, best); }
  updateHUD();
  draw();
  showOverlay("游戏结束", "dead",
    "得分 " + score + " · 最高分 " + best + "\n第 " + level + " 关 · 吃了 " + eaten + "/" + quota + " 个食物",
    [["重试本关", retryLevel], ["回到第 1 关", startGame, true]]);
}
function retryLevel() {
  score = levelStartScore;
  loadLevel(level);
  state = "playing";
  hideOverlay();
  updateHUD();
  draw();
  scheduleTick();
}
function levelClear() {
  state = "levelclear";
  updateHUD();
  draw();
  if (score > best) { best = score; localStorage.setItem(STORE_KEY, best); }
  if (level === LEVELS.length) {
    state = "victory";
    showOverlay("🎉 通关!", "win",
      "已通过全部 " + LEVELS.length + " 关\n总分 " + score + " · 最高分 " + best, 
      [["进入无尽模式", () => gotoLevel(6)], ["重新开始", startGame, true]]);
  } else {
    const next = level + 1;
    showOverlay("第 " + level + " 关通过", "win",
      "即将进入第 " + next + " 关 · 速度加快" + (next <= LEVELS.length ? "" : "(无尽模式)"),
      [["继续", () => gotoLevel(next), true]]);
    timer = setTimeout(() => { if (state === "levelclear") gotoLevel(next); }, 1500);
  }
}
function gotoLevel(n) {
  if (timer) { clearTimeout(timer); timer = null; }
  loadLevel(n);
  state = "playing";
  hideOverlay();
  updateHUD();
  draw();
  scheduleTick();
}
function togglePause() {
  if (state === "playing") {
    state = "paused";
    if (timer) { clearTimeout(timer); timer = null; }
    draw();
    showOverlay("已暂停", "pause", "按 空格 继续", [["继续", togglePause]]);
  } else if (state === "paused") {
    state = "playing";
    hideOverlay();
    scheduleTick();
  }
}

// ---------- 绘制 ----------
function draw() {
  // 背景
  ctx.fillStyle = "#10131f";
  ctx.fillRect(0, 0, W, H);
  // 网格线
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < COLS; i++) { ctx.moveTo(i * CELL + 0.5, 0); ctx.lineTo(i * CELL + 0.5, H); }
  for (let i = 1; i < ROWS; i++) { ctx.moveTo(0, i * CELL + 0.5); ctx.lineTo(W, i * CELL + 0.5); }
  ctx.stroke();
  // 障碍物
  ctx.fillStyle = "#3a3f55";
  obstacleSet.forEach(k => {
    const [x, y] = k.split(",").map(Number);
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
    ctx.fillStyle = "#4a5070";
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, 4);
    ctx.fillStyle = "#3a3f55";
  });
  // 食物
  if (food) {
    const cx = food.x * CELL + CELL / 2, cy = food.y * CELL + CELL / 2;
    ctx.fillStyle = "#ff5d5d";
    ctx.beginPath();
    ctx.arc(cx, cy + 1, CELL * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffb3b3";
    ctx.beginPath();
    ctx.arc(cx - 3, cy - 2, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  // 蛇
  snake.forEach((s, i) => {
    const pad = i === 0 ? 1 : 2;
    ctx.fillStyle = i === 0 ? "#7ef29d" : i === snake.length - 1 ? "#28a05a" : "#34c26b";
    roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, i === 0 ? 6 : 4);
  });
  // 蛇头眼睛
  const h = snake[0];
  const ex = h.x * CELL + CELL / 2 + dir.x * 4, ey = h.y * CELL + CELL / 2 + dir.y * 4;
  const px = dir.x !== 0 ? 0 : 4, py = dir.x !== 0 ? 4 : 0;
  ctx.fillStyle = "#0a2a14";
  [[1, 1], [-1, -1]].forEach(([a, b]) => {
    ctx.beginPath();
    ctx.arc(ex + px * a, ey + py * b, 2, 0, Math.PI * 2);
    ctx.fill();
  });
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.fill();
}

// ---------- 输入 ----------
function enqueue(d) {
  const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if (d.x === last.x && d.y === last.y) return;       // 同向
  if (d.x === -last.x && d.y === -last.y) return;     // 180° 掉头
  if (dirQueue.length < 2) dirQueue.push(d);
}
const KEYMAP = {
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
};
document.addEventListener("keydown", e => {
  if (KEYMAP[e.code]) {
    e.preventDefault();
    if (state === "playing") enqueue(DIRS[KEYMAP[e.code]]);
    return;
  }
  if (e.code === "Space") {
    e.preventDefault();
    if (state === "start") startGame();
    else if (state === "playing" || state === "paused") togglePause();
    else if (state === "levelclear") { /* 等待自动进入下一关,忽略 */ }
    return;
  }
  if (e.code === "Enter" && state === "start") { startGame(); return; }
  if (e.code === "KeyR") {
    if (state === "playing" || state === "paused" || state === "gameover") retryLevel();
  }
});
window.addEventListener("blur", () => { if (state === "playing") togglePause(); });

// ---------- 触屏滑动转向(手机可玩) ----------
let touchStart = null;
document.addEventListener("touchstart", e => {
  if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (touchStart) e.preventDefault();
}, { passive: false });
document.addEventListener("touchend", e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  touchStart = null;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if (Math.max(absX, absY) < 20) return;          // 视为点按(按钮/盖层自身处理)
  if (state !== "playing") return;
  enqueue(absX > absY ? (dx > 0 ? DIRS.right : DIRS.left)
                      : (dy > 0 ? DIRS.down : DIRS.up));
});

// ---------- 启动画面 ----------
loadLevel(1);
updateHUD();
draw();
showOverlay("走格子贪吃蛇", "win",
  "蛇每拍自动走一格,你负责转向\n边缘回卷 · 撞自己或障碍物结束\n共 " + LEVELS.length + " 关,越往后越快",
  [["开始游戏", startGame]]);

// 调试句柄(供自动化测试读取,不影响游戏)
window.game = {
  get state() { return state; },
  get snake() { return snake; },
  get food() { return food; },
  get level() { return level; },
  get eaten() { return eaten; },
  get score() { return score; },
  get dir() { return dir; },
  get obstacles() { return Array.from(obstacleSet); },
  _test: { gotoLevel, startGame },
};
</script>
</body>
</html>
